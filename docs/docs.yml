info:
  description: API Documentation for Yum yum API
  title: Yum yum API
  version: 1.0.0
openapi: 3.0.1
paths:
  /api/menu:
    post:
      tags:
        - Menu
      summary: Add a new product (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - desc
                - price
              properties:
                title:
                  type: string
                desc:
                  type: string
                price:
                  type: number
      responses:
        '201':
          description: Product created successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Server error
  /api/menu/{prodId}:
    put:
      tags:
        - Menu
      summary: Update a product (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prodId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - desc
                - price
              properties:
                title:
                  type: string
                desc:
                  type: string
                price:
                  type: number
      responses:
        '200':
          description: Product updated successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '404':
          description: Product not found
    delete:
      tags:
        - Menu
      summary: Delete a product (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prodId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '404':
          description: Product not found
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Registration failed or invalid input
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '400':
          description: Incorrect username or password
